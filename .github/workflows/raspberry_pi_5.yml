name: Build Raspberry Pi 5

on:
  workflow_dispatch:

jobs:
  raspberry-pi-5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Install cross-build tools and Raspberry Pi OS-compatible sysroot
        shell: bash
        run: |
          set -euo pipefail
          source /etc/os-release
          sudo dpkg --add-architecture arm64
          sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.sources >/dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates ${VERSION_CODENAME}-security
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config

          cache_dir="$PWD/.cache/rpi5-debs"
          sysroot="$PWD/sysroots/raspberry-pi-5"
          mkdir -p "$cache_dir" "$sysroot"
          sudo apt-get --download-only \
            -o "Dir::Cache::archives=$cache_dir" \
            install \
            libgtk-3-dev:arm64 \
            libbluetooth-dev:arm64 \
            libserialport-dev:arm64
          for package in "$cache_dir"/*.deb; do
            sudo dpkg-deb -x "$package" "$sysroot"
          done
          sudo chown -R "$USER:$USER" "$sysroot"
      - name: Build Raspberry Pi 5 bundle
        run: tool/build_raspberry_pi_5.sh "$PWD/sysroots/raspberry-pi-5"
      - name: Upload Raspberry Pi 5 bundle
        uses: actions/upload-artifact@v4
        with:
          name: meshcore-open-linux-arm64-raspberry-pi-5
          path: out/raspberry-pi-5/
          if-no-files-found: error
