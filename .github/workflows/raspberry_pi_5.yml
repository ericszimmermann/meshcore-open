name: Build Raspberry Pi 5

on:
  push:
    branches:
      - ez_raspberry_*
  workflow_dispatch:

jobs:
  raspberry-pi-5:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          flutter_root="$RUNNER_TEMP/flutter"
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$flutter_root"
          "$flutter_root/bin/flutter" --version
          echo "$flutter_root/bin" >> "$GITHUB_PATH"
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Build Raspberry Pi 5 bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/raspberry-pi-5
          flutter config --build-dir=out/raspberry-pi-5
          flutter pub get
          flutter -v build linux --release --no-pub 2>&1 | tee out/raspberry-pi-5/build.log
      - name: Upload Raspberry Pi 5 bundle
        uses: actions/upload-artifact@v4
        with:
          name: meshcore-open-linux-arm64-raspberry-pi-5
          path: out/raspberry-pi-5/linux/arm64/release/bundle
          if-no-files-found: error
